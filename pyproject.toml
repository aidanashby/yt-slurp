[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-slurp"
version = "0.1.0"
description = "Collect YouTube transcripts for a channel or playlist, for analysis with Claude or Gemini Notebook."
readme = "README.md"
requires-python = ">=3.10"
# [default] pulls in yt-dlp-ejs, which solves YouTube's JavaScript challenges using Deno.
dependencies = ["yt-dlp[default]>=2025.11.12"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
yt-slurp = "yt_slurp:main"

[tool.setuptools]
py-modules = ["yt_slurp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
