# Builds yt-slurp.exe on a Windows machine. Publishing a release attaches the
# .exe to it; running the workflow by hand keeps it as a downloadable artifact.
name: Build yt-slurp.exe

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pytest pyinstaller

      - name: Install ffmpeg with yt-slurp's own downloader
        run: |
          python -c "import yt_slurp_setup as s; s.install_tool('ffmpeg'); print(s.tools_dir())"
          "$env:LOCALAPPDATA\yt-slurp\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Test
        run: python -m pytest -q

      - name: Build
        run: >
          pyinstaller --noconfirm --onefile --windowed --name yt-slurp
          --icon icon.ico
          --add-data "icon.png;." --add-data "icon.ico;."
          --collect-all yt_dlp_ejs
          --hidden-import yt_slurp_gui --hidden-import yt_slurp_setup
          yt_slurp_app.py

      - name: Check the build starts
        shell: pwsh
        run: |
          $p = Start-Process dist\yt-slurp.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "yt-slurp.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id

      - uses: actions/upload-artifact@v4
        with:
          name: yt-slurp-exe
          path: dist/yt-slurp.exe

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/yt-slurp.exe --clobber
